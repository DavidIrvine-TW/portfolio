  <body>
    <!-- Initial loader - shows before React loads -->
    <div id="initial-loader">
      <div class="loader-spinner"></div>
    </div>
    <style>
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0A0A0A;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #initial-loader.hide {
        opacity: 0;
        visibility: hidden;
      }
      .loader-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #292524;
        border-top-color: #78716C;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root"></div>
